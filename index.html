<body>
  <div class="titlebar">
    <div class="window-controls">
      <button class="close-btn" onclick="window.electronAPI.closeWindow()"></button>
      <button class="minimize-btn" onclick="window.electronAPI.minimizeWindow()"></button>
      <button class="maximize-btn" onclick="window.electronAPI.toggleMaximizeWindow()"></button>
    </div>
  </div>

  <div class="navbar">
    <div class="nav-buttons">
      <button class="back-btn" onclick="goBack()"></button>
      <button class="forward-btn" onclick="goForward()"></button>
      <button class="reload-btn" onclick="reloadPage()"></button>
      <button class="home-btn" onclick="goHome()"></button>
    </div>
    <div class="url-container">
      <div class="security-icon"></div>
      <input type="text" class="url-bar" id="url" placeholder="Search or enter website name" />
    </div>
  </div>

  <div class="tabs-container" id="tabsContainer">
    <div class="tab active" data-tab-id="1">
      <span class="tab-title">New Tab</span>
      <button class="tab-close" onclick="closeTab(1)">×</button>
    </div>
    <button class="new-tab-btn" onclick="createNewTab()">+</button>
  </div>

  <div class="webview-container">
    <div class="loading-bar" id="loadingBar"></div>
    <webview id="browser" src="https://google.com" style="display:inline-flex;"></webview>
    <div class="status-bar" id="statusBar">Ready</div>
  </div>

  <script>
    const webview = document.getElementById('browser');
    const urlInput = document.getElementById('url');
    const loadingBar = document.getElementById('loadingBar');
    const statusBar = document.getElementById('statusBar');
    let currentTabId = 1;
    let tabs = new Map();

    // Initialize first tab
    tabs.set(1, {
      url: 'https://google.com',
      title: 'New Tab'
    });

    // Update URL bar when the webview's URL changes
    webview.addEventListener('did-navigate', (event) => {
      urlInput.value = event.url;
      updateTabTitle(currentTabId, event.url);
    });

    // Update loading progress
    webview.addEventListener('did-start-loading', () => {
      loadingBar.style.width = '0%';
      statusBar.textContent = 'Loading...';
    });

    webview.addEventListener('did-progress-load', (event) => {
      loadingBar.style.width = `${event.progress * 100}%`;
    });

    webview.addEventListener('did-finish-load', () => {
      loadingBar.style.width = '100%';
      statusBar.textContent = 'Ready';
      setTimeout(() => {
        loadingBar.style.width = '0%';
      }, 500);
    });

    // Tab management
    function createNewTab() {
      const newTabId = Date.now();
      const tabElement = document.createElement('div');
      tabElement.className = 'tab';
      tabElement.dataset.tabId = newTabId;
      tabElement.innerHTML = `
        <span class="tab-title">New Tab</span>
        <button class="tab-close" onclick="closeTab(${newTabId})">×</button>
      `;
      
      document.getElementById('tabsContainer').insertBefore(
        tabElement,
        document.querySelector('.new-tab-btn')
      );

      tabs.set(newTabId, {
        url: 'https://google.com',
        title: 'New Tab'
      });

      switchToTab(newTabId);
    }

    function closeTab(tabId) {
      const tabElement = document.querySelector(`[data-tab-id="${tabId}"]`);
      if (tabElement) {
        tabElement.remove();
        tabs.delete(tabId);
        
        if (tabId === currentTabId && tabs.size > 0) {
          const nextTabId = Array.from(tabs.keys())[0];
          switchToTab(nextTabId);
        }
      }
    }

    function switchToTab(tabId) {
      document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
        if (tab.dataset.tabId === tabId.toString()) {
          tab.classList.add('active');
        }
      });

      currentTabId = tabId;
      const tabData = tabs.get(tabId);
      if (tabData) {
        webview.loadURL(tabData.url);
        urlInput.value = tabData.url;
      }
    }

    function updateTabTitle(tabId, url) {
      const tabData = tabs.get(tabId);
      if (tabData) {
        tabData.url = url;
        tabData.title = new URL(url).hostname;
        const tabElement = document.querySelector(`[data-tab-id="${tabId}"] .tab-title`);
        if (tabElement) {
          tabElement.textContent = tabData.title;
        }
      }
    }

    // Navigation functions
    function goBack() {
      if (webview.canGoBack()) {
        webview.goBack();
      }
    }

    function goForward() {
      if (webview.canGoForward()) {
        webview.goForward();
      }
    }

    function reloadPage() {
      webview.reload();
    }

    function goHome() {
      webview.loadURL('https://google.com');
    }

    // Load the entered URL or perform a search
    function navigateToUrl() {
      let url = urlInput.value.trim();
      const urlPattern = /^(https?:\/\/)?(([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,})(\/.*)?$/;

      if (urlPattern.test(url)) {
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
          url = 'https://' + url;
        }
      } else {
        url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
      }

      webview.loadURL(url);
      updateTabTitle(currentTabId, url);
    }

    // Event listeners
    urlInput.addEventListener('keypress', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        navigateToUrl();
      }
    });

    // Handle window controls
    window.electronAPI = {
      closeWindow: () => {
        require('electron').ipcRenderer.send('close-window');
      },
      minimizeWindow: () => {
        require('electron').ipcRenderer.send('minimize-window');
      },
      toggleMaximizeWindow: () => {
        require('electron').ipcRenderer.send('maximize-window');
      }
    };
  </script>
